<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none';" />
  <title>OV — Companion</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      cursor: grab;
      font-family: 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif;
    }
    body.dragging { cursor: grabbing; }
    #fish-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    .fish-badge {
      position: fixed;
      top: 10px;
      right: 14px;
      z-index: 4;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      background: linear-gradient(135deg, rgba(14, 24, 44, 0.94), rgba(26, 36, 58, 0.94));
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      box-shadow: 0 5px 16px rgba(0, 0, 0, 0.45);
      cursor: pointer;
    }
    .fish-badge.hidden { display: none; }
    .fish-badge.urgent {
      background: linear-gradient(135deg, #ff6a1a, #f59e0b);
      animation: pulse 1.5s ease-in-out infinite;
    }
    .fish-badge.whatsapp {
      background: linear-gradient(135deg, #16a34a, #25d366);
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #fff;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }
  </style>
</head>
<body>
  <canvas id="fish-canvas"></canvas>
  <button id="fish-badge" class="fish-badge hidden" type="button" title="Click to view agents & notifications">
    <span class="dot"></span>
    <span id="fish-badge-text">1</span>
  </button>
  <script src="soundEngine.js"></script>
  <script src="fish-canvas.js"></script>
</body>
</html>
