<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
<title id="title">OV system overview</title><desc id="desc">OV desktop companion connects local AI providers, agent integrations, Windows services, and an optional Android remote.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b0d11"/><stop offset="1" stop-color="#151923"/></linearGradient>
 <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f3f3f3"/><stop offset="1" stop-color="#aab4c3"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".28"/></filter>
 <style>
 .title{font:700 34px 'DejaVu Sans',Arial,sans-serif;fill:#f5f7fa}.sub{font:400 17px 'DejaVu Sans',Arial,sans-serif;fill:#aeb7c6}
 .card{fill:#171d27;stroke:#374151;stroke-width:2}.cardtitle{font:700 21px 'DejaVu Sans',Arial,sans-serif;fill:#f4f6f8}.body{font:400 15px 'DejaVu Sans',Arial,sans-serif;fill:#b8c1ce}
 .line{fill:none;stroke:#8792a3;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:9 9}
 .tag{font:700 12px 'DejaVu Sans',Arial,sans-serif;letter-spacing:1.2px;fill:#dce2ea}
 </style>
</defs>
<rect width="1440" height="820" rx="28" fill="url(#bg)"/>
<text x="76" y="86" class="title">OV · System overview</text>
<text x="76" y="120" class="sub">A local-first desktop companion with optional mobile access.</text>
<!-- center -->
<g filter="url(#shadow)"><rect x="500" y="270" width="440" height="280" rx="26" class="card" stroke="#d6dce5" stroke-width="2.5"/></g>
<text x="720" y="333" text-anchor="middle" class="tag">WINDOWS DESKTOP</text>
<text x="720" y="380" text-anchor="middle" class="cardtitle" style="font-size:34px">OV Companion</text>
<text x="720" y="420" text-anchor="middle" class="body">Floating canvas companion · Living-glass HUD</text>
<text x="720" y="450" text-anchor="middle" class="body">Notifications · Controls · Tasks · Focus tools</text>
<text x="720" y="495" text-anchor="middle" class="body">Electron main process + sandboxed renderer windows</text>
<!-- left top local AI -->
<rect x="80" y="205" width="310" height="150" rx="20" class="card"/>
<text x="112" y="250" class="tag">LOCAL INFERENCE</text><text x="112" y="290" class="cardtitle">Ollama + LM Studio</text>
<text x="112" y="322" class="body">Model discovery · Chat · Think mode</text>
<path d="M390 285 H500" class="line"/><path d="M482 275 L500 285 L482 295" class="line"/>
<!-- left bottom agents -->
<rect x="80" y="465" width="310" height="150" rx="20" class="card"/>
<text x="112" y="510" class="tag">DEVELOPER AGENTS</text><text x="112" y="550" class="cardtitle">Agent awareness</text>
<text x="112" y="582" class="body">Hooks · Process discovery · Approvals</text>
<path d="M390 540 H500" class="line"/><path d="M482 530 L500 540 L482 550" class="line"/>
<!-- right top system integration -->
<rect x="1050" y="205" width="310" height="150" rx="20" class="card"/>
<text x="1082" y="250" class="tag">WINDOWS INTEGRATION</text><text x="1082" y="290" class="cardtitle">Desktop services</text>
<text x="1082" y="322" class="body">Apps · Media · Wi-Fi · Bluetooth · Alerts</text>
<path d="M940 285 H1050" class="line"/><path d="M1032 275 L1050 285 L1032 295" class="line"/>
<!-- right bottom mobile -->
<rect x="1050" y="465" width="310" height="150" rx="20" class="card"/>
<text x="1082" y="510" class="tag">OPTIONAL MOBILE REMOTE</text><text x="1082" y="550" class="cardtitle">Android + mobile web</text>
<text x="1082" y="582" class="body">Pairing PIN · Bearer token · Offline queue</text>
<path d="M940 540 H1050" class="line dash"/><path d="M1032 530 L1050 540 L1032 550" class="line"/>
<!-- security footer -->
<rect x="310" y="690" width="820" height="78" rx="18" fill="#10151d" stroke="#4b5563" stroke-width="1.5"/>
<text x="720" y="722" text-anchor="middle" class="tag">SECURITY BOUNDARIES</text>
<text x="720" y="750" text-anchor="middle" class="body">Loopback-only hook server · Token-authenticated mobile bridge · Worldwide tunnel off by default</text>
<path d="M720 550 V690" class="line dash"/>
</svg>