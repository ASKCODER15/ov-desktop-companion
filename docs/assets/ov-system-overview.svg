<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">OV v8.0 — Robot OS System Architecture</title>
  <desc id="desc">OV v8.0 local-first Windows AI robot companion connecting local Whisper voice assistant (A+S+W), 7 named neural voices, optional Ollama/LM Studio, live coding-agent telemetry, Windows controls, and an optional Android remote.</desc>
  <defs>
    <style>
      .title { font: 700 32px 'Consolas', 'Courier New', monospace; fill: #f2efe9; }
      .sub { font: 400 16px 'Consolas', 'Courier New', monospace; fill: #9ca3af; }
      .card { fill: #181a20; stroke: #2c313c; stroke-width: 2; }
      .card-center { fill: #14161b; stroke: #f2efe9; stroke-width: 2.5; }
      .cardtitle { font: 700 20px 'Consolas', 'Courier New', monospace; fill: #f2efe9; }
      .body { font: 400 14px 'Consolas', 'Courier New', monospace; fill: #b8c1ce; }
      .line { fill: none; stroke: #ff5500; stroke-width: 2.5; stroke-linecap: square; stroke-linejoin: miter; }
      .line-green { fill: none; stroke: #00d68f; stroke-width: 2.5; stroke-linecap: square; stroke-linejoin: miter; }
      .dash { stroke-dasharray: 8 6; }
      .tag { font: 700 11px 'Consolas', 'Courier New', monospace; letter-spacing: 1.4px; fill: #ff5500; }
      .tag-green { font: 700 11px 'Consolas', 'Courier New', monospace; letter-spacing: 1.4px; fill: #00d68f; }
    </style>
  </defs>
  <rect width="1440" height="820" rx="6" fill="#101114" stroke="#262a33" stroke-width="2" />
  <rect x="64" y="48" width="12" height="12" fill="#ff5500" />
  <text x="90" y="61" class="title">OV v8.0 // ROBOT OS ARCHITECTURE</text>
  <text x="90" y="92" class="sub">Local-first Windows robot companion · Offline Whisper (A+S+W) · Zero external runtime npm dependencies</text>

  <!-- Center Core -->
  <rect x="480" y="235" width="480" height="310" rx="4" class="card-center" />
  <rect x="480" y="235" width="480" height="6" fill="#ff5500" />
  <text x="720" y="285" text-anchor="middle" class="tag">WINDOWS DESKTOP CORE</text>
  <text x="720" y="330" text-anchor="middle" class="cardtitle" style="font-size:28px">OV // ROBOT OS</text>
  <text x="720" y="370" text-anchor="middle" class="body">4 Industrial Robots: Kronos · Aegis · Optix · Orbit</text>
  <text x="720" y="402" text-anchor="middle" class="body">Zero-Gradient Hardware UI · Mini Popover Media</text>
  <text x="720" y="434" text-anchor="middle" class="body">Live Top-of-Head Timers · Dance &amp; Multitask Modes</text>
  <text x="720" y="476" text-anchor="middle" class="body" style="fill:#00d68f">Sandboxed Electron (contextIsolation + sandbox: true)</text>
  <text x="720" y="506" text-anchor="middle" class="body">Private Local Storage: %LOCALAPPDATA%\PetFish\</text>

  <!-- Left Top: Local Voice & AI -->
  <rect x="64" y="185" width="330" height="165" rx="4" class="card" />
  <text x="92" y="226" class="tag-green">OFFLINE VOICE &amp; LOCAL AI</text>
  <text x="92" y="262" class="cardtitle">Whisper (A+S+W) + LLM</text>
  <text x="92" y="294" class="body">faster-whisper-base offline STT</text>
  <text x="92" y="320" class="body">7 Named Voices · Optional Ollama</text>
  <path d="M394 270 H480" class="line-green" />
  <path d="M466 260 L480 270 L466 280" class="line-green" />

  <!-- Left Bottom: Coding Agents -->
  <rect x="64" y="430" width="330" height="165" rx="4" class="card" />
  <text x="92" y="471" class="tag">LIVE DEVELOPER TELEMETRY</text>
  <text x="92" y="507" class="cardtitle">AI Coding Agents</text>
  <text x="92" y="539" class="body">Antigravity · Claude Code · Cursor</text>
  <text x="92" y="565" class="body">Head Timer · Voice Reports · Hooks</text>
  <path d="M394 505 H480" class="line" />
  <path d="M466 495 L480 505 L466 515" class="line" />

  <!-- Right Top: Windows Control -->
  <rect x="1046" y="185" width="330" height="165" rx="4" class="card" />
  <text x="1074" y="226" class="tag">WINDOWS OS CONTROL</text>
  <text x="1074" y="262" class="cardtitle">Desktop Services</text>
  <text x="1074" y="294" class="body">189 Indexed Apps · Web Launcher</text>
  <text x="1074" y="320" class="body">Music Player · Wi-Fi · BT · Focus</text>
  <path d="M960 270 H1046" class="line" />
  <path d="M1032 260 L1046 270 L1032 280" class="line" />

  <!-- Right Bottom: Optional Android Remote -->
  <rect x="1046" y="430" width="330" height="165" rx="4" class="card" />
  <text x="1074" y="471" class="tag-green">OPT-IN MOBILE REMOTE</text>
  <text x="1074" y="507" class="cardtitle">Android APK + Web</text>
  <text x="1074" y="539" class="body">6-Digit PIN · 256-bit Bearer Token</text>
  <text x="1074" y="565" class="body">Offline Task Sync · Opt-in HTTPS</text>
  <path d="M960 505 H1046" class="line-green dash" />
  <path d="M1032 495 L1046 505 L1032 515" class="line-green" />

  <!-- Security Footer -->
  <rect x="220" y="665" width="1000" height="92" rx="4" fill="#14161b" stroke="#00d68f" stroke-width="1.5" />
  <text x="720" y="700" text-anchor="middle" class="tag-green">SECURITY &amp; PRIVACY BOUNDARIES</text>
  <text x="720" y="732" text-anchor="middle" class="body">Loopback-only Hook Server (127.0.0.1:47821) · Constant-Time Token Auth · icacls User ACLs · Zero Telemetry</text>
  <path d="M720 545 V665" class="line-green dash" />
</svg>
